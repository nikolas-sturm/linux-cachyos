name: Build laptop kernel

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CCACHE_DIR: /home/builder/.ccache

jobs:
  build:
    name: Zen 4 Clang ThinLTO
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up build environment
        run: |
          cat << 'EOF' >> /etc/pacman.conf
          [cachyos]
          Server = https://mirror.cachyos.org/repo/x86_64/cachyos
          EOF

          pacman-key --init
          pacman-key --recv-keys F3B607488DB35A47 --keyserver keyserver.ubuntu.com
          pacman-key --lsign-key F3B607488DB35A47
          pacman -Syu --noconfirm --needed ccache

          useradd builder -m
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chmod -R a+rw .

          sed -i 's/#MAKEFLAGS="-j2"/MAKEFLAGS="-j$(nproc) -l$(nproc)"/' /etc/makepkg.conf
          sed -i 's|!ccache|ccache|' /etc/makepkg.conf
          sed -i 's/#PACKAGER=".*"/PACKAGER="GitHub Actions laptop build"/' /etc/makepkg.conf

          sudo -H -E -u builder mkdir -p "$CCACHE_DIR"
          sudo -H -E -u builder ccache --max-size=8G

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-clang-zen4-${{ github.run_id }}
          restore-keys: |
            ccache-clang-zen4-

      - name: Build packages
        working-directory: linux-cachyos
        env:
          _build_zfs: no
          _build_nvidia_open: no
          _build_r8125: no
          _use_llvm_lto: thin
          _processor_opt: zen4
          _localmodcfg: yes
          _ci_fast_build: no
          _laptop_config: yes
          _reduced_debug_info: yes
        run: |
          export _localmodcfg_path="$PWD/laptop-modules"
          sudo -H -E -u builder makepkg --skipchecksums --syncdeps --noconfirm
          sudo -H -E -u builder ccache --show-stats

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: linux-cachyos-tsc-${{ github.run_number }}
          path: |
            linux-cachyos/linux-cachyos-tsc-*.pkg.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
